name: rollback-app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab-app]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: deploy/app-colours.sh rollback
