# After CI succeeds on main, smoke-test the idle app colour and switch traffic.
# Runs on the self-hosted runner (label lab-app) with the host's instance profile (decision 001).
# Triggered by workflow_run, never by pull_request (AGENTS.md rule 4).
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.LAB_BLUE_GREEN == 'on' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, lab-app]
    timeout-minutes: 25
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify push CI before manual cutover
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
            curl -fsS --max-time 20 --config - \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$SHA&event=push&branch=main&status=success" |
            jq -e --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" 'any(.workflow_runs[];
              .head_sha==$sha and .event=="push" and .head_branch=="main"
              and .head_repository.full_name==$repo and .conclusion=="success")'
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy and verify the idle colour
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/app-colours.sh deploy "$SHA"
